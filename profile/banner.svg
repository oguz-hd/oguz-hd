<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Oguz Han Duran - Junior Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#131A24"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3C6488" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7FB3E8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3C6488" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#2D4A63" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7FB3E8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2D4A63" stop-opacity="0.25"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D4A63"/><stop offset="50%" stop-color="#3C6488"/><stop offset="100%" stop-color="#2D4A63"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25404F"/><stop offset="50%" stop-color="#31586B"/><stop offset="100%" stop-color="#25404F"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1C2430" stroke-width="1"/>
    </pattern>

    <clipPath id="frame"><rect x="0" y="0" width="1000" height="240" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)" opacity="0.55"/>

    <g opacity="0.55">
      <path d="M-360 196 C -240 172, -120 220, 0 196 S 240 172, 360 196 S 600 220, 720 196 S 960 172, 1080 196 S 1320 220, 1440 196 L1440 240 L-360 240 Z" fill="url(#wave2)" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0; -360 0" dur="18s" repeatCount="indefinite"/>
      </path>
      <path d="M-360 212 C -240 190, -120 234, 0 212 S 240 190, 360 212 S 600 234, 720 212 S 960 190, 1080 212 S 1320 234, 1440 212 L1440 240 L-360 240 Z" fill="url(#wave1)" opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="-360 0; 0 0" dur="26s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#7FB3E8">
      <circle cx="140" cy="70" r="2">
        <animate attributeName="cy" values="70;54;70" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.6;0.15" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="48" r="1.6">
        <animate attributeName="cy" values="48;36;48" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.5;0.1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="690" cy="64" r="2.2">
        <animate attributeName="cy" values="64;46;64" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.12;0.55;0.12" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="860" cy="100" r="1.8">
        <animate attributeName="cy" values="100;86;100" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.45;0.1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="930" cy="52" r="1.4">
        <animate attributeName="cy" values="52;40;52" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="500" y="112" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#E6EDF3" opacity="0">
      O&#x11F;uz Han Duran
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 14; 0 0" dur="1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </text>

    <line x1="370" y1="132" x2="630" y2="132" stroke="url(#line)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" from="260" to="0" dur="1.1s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </line>
    <circle cy="132" r="2.6" fill="#BFD8F2" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="370;630" dur="4s" begin="1.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>

    <text x="500" y="166" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#93A3B4" letter-spacing="3" opacity="0">
      JUNIOR DEVELOPER
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10; 0 0" dur="0.9s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </text>

    <rect x="0" y="235" width="1000" height="5" fill="url(#sweep)" opacity="0.85"/>
  </g>
</svg>
